<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criptografia de Senhas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>🔐 Criptografia de Senhas</h1>
        <p>Digite uma senha numérica para criptografá-la.</p>

        <label for="senha">Senha original:</label>
        <input
            type="text"
            id="senha"
            placeholder="Ex: 123456"
            maxlength="50"
            inputmode="numeric"
        >

        <label for="chave">Valor para adicionar a cada número:</label>
        <input
            type="number"
            id="chave"
            value="1"
            min="1"
            max="9"
        >

        <button onclick="criptografar()">Criptografar</button>
        <button onclick="descriptografar()">Descriptografar</button>

        <div class="resultado">
            <h2>Resultado:</h2>
            <p id="resultado">Sua senha aparecerá aqui.</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
